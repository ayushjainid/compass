<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* feel like an app: taps are taps, so no double-tap zoom (and no tap delay waiting for a second tap) */
html,body{touch-action:manipulation}
@media (pointer:coarse){body{-webkit-tap-highlight-color:transparent}}
body{margin:0;overflow-x:clip}
/* iOS zooms into any field under 16px and leaves the page panned sideways; touch screens get 16px fields */
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
img{max-width:100%}
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EDEA; --ink:#17201E; --ink2:#46524E; --muted:#5E6865; --line:#D9DFDB;
  --accent:#23466F; --accent-soft:#E2E9F3; --on-accent:#FFFFFF; --brass:#895D18; --brass-soft:#F4EAD8;
  --good:#2B714F; --good-soft:#DFEFE5; --warn:#95570C; --warn-soft:#F6E9D6; --scrim:rgba(18,26,24,.38);
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
  --lift:0 1px 2px rgba(18,26,24,.04),0 2px 8px -2px rgba(18,26,24,.06);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101514; --surface:#191F1E; --sunk:#232B29; --ink:#E7ECEA; --ink2:#B4BEBA; --muted:#8B9592; --line:#2D3533;
    --accent:#93B3DC; --accent-soft:#1E2A39; --on-accent:#0D1623; --brass:#D8A75C; --brass-soft:#33291A;
    --good:#72C69D; --good-soft:#16302A; --warn:#E3A65C; --warn-soft:#33281A; --scrim:rgba(0,0,0,.55);--lift:none;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101514; --surface:#191F1E; --sunk:#232B29; --ink:#E7ECEA; --ink2:#B4BEBA; --muted:#8B9592; --line:#2D3533;
  --accent:#93B3DC; --accent-soft:#1E2A39; --on-accent:#0D1623; --brass:#D8A75C; --brass-soft:#33291A;
  --good:#72C69D; --good-soft:#16302A; --warn:#E3A65C; --warn-soft:#33281A; --scrim:rgba(0,0,0,.55);--lift:none;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:600px;margin:0 auto;padding-block:8px 110px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:600 22px/1 var(--display);letter-spacing:-.01em}
.brand svg{width:28px;height:28px;overflow:visible}
.hneedle{transform-box:view-box;transform-origin:16px 16px;--tilt:0deg;--amp:3deg;animation:wobble 3.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(calc(var(--tilt) - var(--amp)))}50%{transform:rotate(calc(var(--tilt) + var(--amp)))}}
.weeknav{display:flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.weeknav button{width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--ink2)}
.weeknav button:hover{background:var(--sunk)}
.weeknav .lbl{min-width:118px;text-align:center;font-weight:500}
.weeknav .lbl small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.04em;text-transform:uppercase}
.statusline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-block:0 10px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--brass)}
.island{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 14px 10px;margin:6px 0 14px}
.island .statusline{padding-block:8px 0}
.island .statusline:has(#heading:empty){display:none}
.bname{display:flex;flex-direction:column;gap:3px}
.bname .sync{font:400 11.5px/1.2 var(--sans);letter-spacing:0;color:var(--muted)}
.bname .sync[hidden]{display:none}
.island .statusline[hidden]{display:none}
.islandx:empty{display:none}
.islandx{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.islandx .obprog{margin:0}
body.landing .island{display:none}
.ntrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ntime{display:flex;align-items:center;gap:12px;padding:0 0 10px}.ntime .flabel{margin:0;flex:1}.ntime input{max-width:150px}
.ntios{margin-top:4px}
.ntdevs{display:flex;flex-direction:column;gap:6px;padding:12px 0 4px;border-top:1px solid var(--line);align-items:flex-start}
.ntdev{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;font-size:14px}
.nttest{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:14px;display:flex;flex-direction:column;gap:4px}
.nttest>span+span{margin-left:8px}.nttest:has(.thinking){flex-direction:row;align-items:center;gap:10px}
.nttest.bad{background:var(--warn-soft)}
.nttest ul{margin:2px 0;padding-left:18px}.nttest li.ok::marker{color:var(--good)}.nttest li.bad{color:var(--warn)}
.nttest code{font-size:12.5px}
.ntask{margin:8px 0 14px;border-color:var(--accent)}
.fade{margin:8px 0 14px;border-color:var(--good)}
.csecs{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.csec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:12px;box-shadow:var(--lift)}
.csh{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;min-height:60px}
.cst{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cst b{font:600 17px/1.2 var(--display);display:flex;align-items:center;gap:8px}
.cst small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:none}
.chev{flex:none;width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
.csec.open .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.csb{padding:0 16px 16px;border-top:1px solid var(--line);padding-top:14px;animation:rise .25s cubic-bezier(.2,.8,.2,1)}
.csb > .card:first-child,.csb .meter:first-child{margin-top:0}
.csb h3{margin-top:14px}
.csb .field{padding:10px 0}.csb .field:first-child{padding-top:0}
h2.h3{font:600 12px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin-block:0 12px}

/* type */
h1{font:600 34px/1.08 var(--display);margin:10px 0 8px;letter-spacing:-.015em;text-wrap:balance}
h2{font:600 24px/1.15 var(--display);margin:18px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 8px}
.lede{color:var(--ink2);margin:0 0 6px;max-width:62ch}
.hint{font-size:13px;color:var(--muted)}
.src{font-size:11.5px;color:var(--muted);font-style:italic}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--lift)}
.card + .card{margin-top:10px}
.pad{padding:14px}

/* day strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:10px;font-variant-numeric:tabular-nums}
.strip .wd{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.strip .ring{--p:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);font-weight:600;font-size:13px;transition:--p .4s}
.strip .ring span{width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.strip .ring.full{background:var(--good)}
.strip button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.strip button.today .wd{color:var(--brass);font-weight:600}
/* days still ahead stay grey but can be opened */
.strip button.future .wd,.strip button.future .ring span{color:var(--muted)}
.strip button.future .ring{background:var(--sunk)}
.strip button.future[aria-pressed="true"] .ring span,.strip button.future[aria-pressed="true"] .wd{opacity:1;color:var(--ink2)}
.strip button:disabled{opacity:.35}

/* check rows */
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;min-height:52px}
.check + .check{border-top:1px solid var(--line)}
.check .box{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);animation:pop .28s cubic-bezier(.3,1.7,.5,1)}
.check[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check .lbl{display:flex;flex-direction:column;min-width:0}
.check .lbl small{color:var(--muted);font-size:12.5px}
.check .tail{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

/* journal & fields */
.jf,.field{display:flex;flex-direction:column;gap:4px;padding:12px 14px}
.jf + .jf,.field + .field{border-top:1px solid var(--line)}
.jf label,.field label,.flabel{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
::placeholder{color:var(--muted);opacity:1}
textarea,input[type=text],input[type=email],input[type=password],select,input[type=time],input[type=date],input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;resize:vertical}
textarea{min-height:44px}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:8px;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px 8px 10px;font-size:14px;min-height:40px;transition:transform .12s}
.chip b{font-weight:600;color:var(--accent)}
.chip .n{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.chip.sel .n,.chip[aria-pressed="true"] .n{color:inherit}
.chip.done{background:var(--good-soft);border-color:transparent}
.chip.done .n{color:var(--good)}
.chip.fun{background:var(--brass-soft);border-color:transparent}
.chip.fun b{color:var(--brass)}
.chip:active{transform:scale(.95)}
.chip.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.sel b{color:var(--on-accent)}

/* values */
.val{padding:12px 14px}
.val + .val{border-top:1px solid var(--line)}
.vhead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.vhead b{font-weight:600}
.core{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--brass);margin-left:6px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-block}
.pill.clear{background:var(--good-soft);color:var(--good)}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.missed{background:var(--warn-soft);color:var(--warn)}
.pill.rest{background:var(--sunk);color:var(--muted)}
.pill.stamp{animation:stamp .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.floors{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px}
.floors li{display:flex;gap:8px;font-size:13.5px;color:var(--ink2)}
.floors li span:first-child{flex:1}
.floors li .f{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.floors li.ok{color:var(--muted)} .floors li.ok .f{color:var(--good)}

/* counters */
.ctr{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px}
.ctr + .ctr{border-top:1px solid var(--line)}
.ctr .lbl{flex:1;display:flex;flex-direction:column;min-width:0}
.ctr .lbl small{color:var(--muted);font-size:12.5px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--sunk);font-size:18px;line-height:1}
.stepper button.plus{background:var(--accent);color:var(--on-accent)}
.stepper .v{min-width:52px;text-align:center;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.stepper .v.met{color:var(--good)}

.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--sunk);flex:none;transition:background .15s;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-weight:500;border:1px solid var(--line);background:var(--surface);min-height:40px;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.quiet{border-color:transparent;color:var(--ink2);padding-inline:8px;background:transparent}
.btn.danger{color:var(--warn)}
.btn.small{min-height:32px;padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.5}
.linkbtn{color:var(--accent);font-weight:500;text-decoration:none;white-space:nowrap}
.linkbtn:hover{text-decoration:underline}

/* felt */
.felt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.felt button{border:1px solid var(--line);border-radius:10px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface)}
.felt button b{font:600 22px/1 var(--display)}
.felt button small{font-size:11px;color:var(--muted)}
.felt button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:pop .28s cubic-bezier(.3,1.7,.5,1)}
.felt button[aria-pressed="true"] small{color:var(--on-accent);opacity:.8}

.trip{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:0 var(--r) var(--r) 0;padding:10px 12px;font-size:14px}
.trip + .trip{margin-top:6px}
.spark{width:100%;height:auto;display:block}
.spark text{fill:var(--muted);font:500 10px var(--mono)}

/* suggestions */
.sugg{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.sugg + .sugg{border-top:1px solid var(--line)}
.sugg .glyph{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brass-soft);display:grid;place-items:center}
.sugg .glyph svg{width:16px;height:16px;stroke:var(--brass);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sugg .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sugg .body b{font-weight:600}
.sugg .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.coach{white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--muted)}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--brass);animation:bounce 1s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}

/* people */
.person{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px}
.person + .person{border-top:1px solid var(--line)}
.person .who{flex:1;min-width:0}
.person .who b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .who small{color:var(--muted);font-size:12.5px}
.due{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.due.over{background:var(--warn-soft);color:var(--warn)} .due.now{background:var(--accent-soft);color:var(--accent)} .due.later{background:var(--sunk);color:var(--muted)}
.addrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:12px 14px}
@media (max-width:420px){.addrow.three{grid-template-columns:1fr 1fr}.addrow.three input{grid-column:1/-1}}

/* component rows (design) */
.comp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;min-height:54px}
.comp + .comp{border-top:1px solid var(--line)}
.comp .lbl{flex:1;min-width:0;display:flex;flex-direction:column}
.comp .lbl small{color:var(--muted);font-size:12.5px}
.tags{display:flex;gap:4px;flex-wrap:wrap}

.lookcard .lk{grid-column:1;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.lookcard b{grid-column:1;font:600 18px/1.25 var(--display)}.lookcard small{grid-column:1;color:var(--ink2);font-size:13px}
.lookcard .chev{grid-column:2;grid-row:1/4;align-self:center;width:9px;height:9px;border:solid var(--accent);border-width:0 2px 2px 0;transform:rotate(-45deg)}
.lkhead{display:flex;align-items:center;gap:10px;margin:6px 0 2px}.lkhead .eyebrow{display:block}
.iconbtn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--sunk);color:var(--ink);font-size:22px;line-height:1}
.lknav{display:flex;justify-content:space-between;margin:0 0 12px}
.lktiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}
.lktile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lktile b{font:600 26px/1.1 var(--display);overflow-wrap:anywhere}.lktile b small{font-size:15px;color:var(--muted);font-weight:500}
.lktile span{font-size:12.5px;color:var(--ink2);line-height:1.3}.lktile>small{font-size:11.5px;color:var(--muted)}
.lkvals{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lkvals li{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;align-items:center;gap:10px}
.lkvals .nm{min-width:0;overflow-wrap:anywhere}.lkvals .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.lkdots{display:flex;gap:5px}.lkdots i{flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.lkdots i.ok{background:var(--good);border-color:var(--good)}.lkdots i.rest{background:var(--sunk)}.lkdots i.miss{border-color:var(--warn)}.lkdots i.open{border-style:dashed}
.lkbest{display:flex;flex-direction:column;gap:2px}.lkbest small{color:var(--muted)}
.lkcols{display:grid;gap:10px}@media(min-width:700px){.lkcols{grid-template-columns:1fr 1fr}}
.lkfl{list-style:none;margin:6px 0 0;padding:0}.lkfl li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.lkfl li:last-child{border-bottom:0}
.lkfl small{color:var(--muted);font-variant-numeric:tabular-nums}.lkfl small.ok{color:var(--good)}
.lkwords{list-style:none;margin:0;padding:0;display:grid;gap:10px}.lkwords q{font:500 16px/1.4 var(--display);font-style:italic}.lkwords small{display:block;color:var(--muted);font-size:12px}
.lkextra{margin:14px 0 0}.lkadj{margin-top:14px;display:grid;gap:4px}.lkadj q{font-style:italic}.lkadj small{color:var(--muted)}
.lklink{display:inline-block;margin:14px 0 0}
.tmedit{margin:6px 0 14px}
.tmrow{display:flex;gap:8px}.tmrow input{flex:1;min-width:0}
.tmacts{display:grid;gap:8px}
.tmact{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);min-height:52px}
.tmact:hover{border-color:var(--accent)}
.tmact b{font-weight:600;font-size:15px}.tmact small{color:var(--muted);font-size:12.5px}
.tmact.good b{color:var(--good)}.tmact.danger b{color:var(--warn)}
.task{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:52px}
.task + .task{border-top:1px solid var(--line)}
.task .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.task .tx small{color:var(--muted);font-size:12.5px}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;position:relative}
.lrow .tick::before,.fslot .tick::before,.isub .tick::before{content:"";position:absolute;inset:-10px}
.tick:hover{border-color:var(--accent)}
.tick.on{background:var(--good);border-color:var(--good)}
.tick.on::after{content:"";width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.tag.core{background:var(--brass-soft);color:var(--brass)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
details.fold{margin-top:10px}
details.fold summary{cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 0;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"▸ ";}
details.fold[open] summary::before{content:"▾ ";}
.stepin2{display:flex;gap:8px;margin-top:6px}
.sortcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:0 18px 40px -24px rgba(10,20,30,.4);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.sortcard .q{font:600 22px/1.25 var(--display);letter-spacing:-.01em;word-break:break-word}
.sortgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:58px}
.sbtn b{font-weight:600;font-size:14.5px}
.sbtn small{color:var(--muted);font-size:12px;line-height:1.3}
.sbtn kbd{position:absolute;top:8px;right:9px;font:500 10.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.sbtn.sug{border-color:var(--brass);box-shadow:0 0 0 1.5px var(--brass)}
.sbtn.sug::before{content:"Suggested";position:absolute;top:-9px;left:10px;background:var(--brass);color:var(--on-accent);font-size:10px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:5px}
.sbtn:hover{border-color:var(--accent)}
.sbtn.full{grid-column:1/-1}
@media (hover:none){.sbtn kbd{display:none}}
.meterline{display:flex;gap:6px;align-items:center}
.meterline i{width:22px;height:6px;border-radius:3px;background:var(--sunk)}
.meterline i.on{background:var(--accent)}

/* ---------- landing: tour ---------- */
.tour{display:grid;grid-template-columns:1fr auto;gap:48px;align-items:center;margin-top:30px}
@media (max-width:880px){.tour{grid-template-columns:minmax(0,1fr);gap:24px}.tour .phone{order:-1;margin-inline:auto}}
.tsteps{list-style:none;margin:0;padding:0;display:grid;gap:6px;min-width:0}
.tsteps button{width:100%;text-align:left;border-radius:14px;padding:14px 16px;display:grid;gap:4px;border:1px solid transparent;transition:background .2s,border-color .2s}
.tsteps button b{font:600 18px/1.2 var(--display)}
.tsteps button span{color:var(--muted);font-size:14px}
.tsteps button[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.tsteps button[aria-current="true"] span{color:var(--ink2)}
.tbar{display:block;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;width:0;background:var(--accent)}
.tsteps button[aria-current="true"] .tbar i{animation:tprog var(--tdur,6s) linear forwards}
.tour.still .tsteps button[aria-current="true"] .tbar i{animation:none;width:100%}
@keyframes tprog{to{width:100%}}
@media (max-width:880px){.tsteps{grid-template-columns:repeat(3,1fr)}.tsteps button{padding:10px}.tsteps button b{font-size:14.5px}.tsteps button span{display:none}}
.phone{width:330px;max-width:100%;aspect-ratio:9/17.5;border-radius:40px;background:#0E1311;padding:10px;box-shadow:0 40px 80px -40px rgba(10,20,30,.55),inset 0 0 0 1.5px #2a322f}
.pscreen{height:100%;border-radius:31px;background:var(--bg);overflow:hidden;padding:26px 14px 14px;position:relative;font-size:13px;display:flex;flex-direction:column;gap:9px}
.pscreen .pt{font:600 20px/1.15 var(--display)}
.pscreen .ps{color:var(--muted);font-size:12px}
.pscreen .card{border-radius:12px}
.pscreen .mini{display:flex;align-items:center;gap:9px;padding:8px 10px;font-size:13px}
.pscreen .mini + .mini{border-top:1px solid var(--line)}
.pscreen .mbox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;transition:all .25s}
.pscreen .mbox.on{background:var(--accent);border-color:var(--accent)}
.pscreen .mbox.on::after{content:"";width:4px;height:8px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.pscreen .vgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pscreen .vc{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-size:12px;font-weight:600;transition:all .25s}
.pscreen .vc.on{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.03)}
.pscreen .tin{opacity:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) forwards}
.pscreen .typing{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;min-height:38px;font-size:13px}
.pscreen .typing::after{content:"";display:inline-block;width:1.5px;height:14px;background:var(--accent);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pscreen .bkts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:auto}
.pscreen .bk{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 4px;text-align:center;font-size:10.5px;color:var(--muted);transition:all .25s}
.pscreen .bk b{display:block;font:600 18px var(--display);color:var(--ink)}
.pscreen .bk.hit{border-color:var(--accent);background:var(--accent-soft)}
.pscreen .scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font:600 17px/1.25 var(--display);transition:transform .35s ease,opacity .35s ease}
.pscreen .scard.out{transform:translateX(120%) rotate(8deg);opacity:0}
.pscreen .sopts{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pscreen .so{border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:11.5px;font-weight:600;background:var(--surface);transition:all .2s}
.pscreen .so.pick{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pscreen .pill{font-size:10.5px}
.pscreen .spk path{stroke-dasharray:260;stroke-dashoffset:260;transition:stroke-dashoffset 1.6s ease}
.pscreen .spk.draw path{stroke-dashoffset:0}

/* sign-in & account */
.signin{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:10px 40px}
.signin .lede{margin-inline:auto}
.gbtn{display:inline-flex;align-items:center;gap:12px;background:#FFFFFF;color:#1F1F1F;border:1px solid #747775;border-radius:999px;padding:0 20px 0 14px;height:48px;font:500 15px/1 "Roboto",var(--sans);margin-top:18px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.gbtn:hover{background:#F8F9FA}
.gbtn:disabled{opacity:.6}
.gbtn svg{width:20px;height:20px}
.fine{font-size:12.5px;color:var(--muted);max-width:44ch;margin:14px auto 0}
.avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.topright{display:flex;align-items:center;gap:6px}
.mdatebtn{border:1px dashed var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink2);white-space:nowrap;min-height:38px}
.mdatebtn.set{border-style:solid;border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accent-soft)}
.mcals{display:grid;gap:18px}@media (min-width:640px){.mcals{grid-template-columns:1fr 1fr}}
.mcal>b{font:600 16px var(--display);display:block;margin-bottom:8px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.mwd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px}
.mgrid button{position:relative;aspect-ratio:1;max-height:44px;border-radius:50%;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.mgrid button:hover:not(:disabled){background:var(--sunk)}
.mgrid button.today{box-shadow:inset 0 0 0 1.5px var(--brass);font-weight:600}
.mgrid button.sel{background:var(--accent);color:var(--on-accent);font-weight:600}
.mgrid button:disabled{color:var(--muted);opacity:.4}
.mgrid button i{position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--brass)}
.calbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.calbtns .btn{flex:1 1 140px}
/* phones: logo and account on one line, the week switcher gets its own full-width row */
@media (max-width:560px){
  .top{display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:12px;padding-block:10px 4px}
  .topright{display:contents}
  #acctBtn{grid-column:2;grid-row:1;width:36px;height:36px}
  .weeknav{grid-column:1/-1;grid-row:2;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 6px}
  .weeknav[hidden]{display:none}
  .weeknav .lbl{flex:1}
}
.greet{font:500 15px/1.3 var(--sans);color:var(--ink2);margin:4px 0 2px}
.greetin{color:var(--ink);font-weight:500}
.fhist{display:grid;gap:10px}
.fh{display:grid;grid-template-columns:minmax(0,1fr) auto 34px;align-items:center;gap:10px}
.fh .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh .bars{display:flex;align-items:flex-end;gap:3px;height:22px}
.fh .bars i{display:block;width:9px;height:var(--h,8%);border-radius:2px;background:var(--line)}
.fh .bars i.ok{background:var(--good)}.fh .bars i.part{background:var(--brass);background:color-mix(in srgb,var(--brass) 75%,transparent)}
.fh .bars i.none{background:var(--line);background:color-mix(in srgb,var(--muted) 35%,transparent);height:8%}
.fh .bars i.rest,.fh .bars i.pre{background:none;border-bottom:2px dotted var(--line);height:2px;border-radius:0}
.fh .bars i.now{outline:1.5px solid var(--ink2);outline-offset:1px}
.fh .sum{font:500 12.5px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.dtime{color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums}
.h3n{font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--muted);margin-left:6px}
.dayrow .lbl small{display:block}.dayrow .sep{opacity:.7}
.dayrow.weekly,.dayrow.monthly{box-shadow:inset 3px 0 0 var(--vc)}
.ktag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--sunk);background:color-mix(in srgb,var(--vc) 18%,transparent);color:var(--ink2);vertical-align:1px}
.dayrow.going{animation:rowout .38s ease forwards}
@keyframes rowout{0%{opacity:1}60%{opacity:.5}100%{opacity:0;transform:translateY(6px)}}
.donefold{margin-top:8px;border:1px dashed var(--line);border-radius:var(--r)}
.donehead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;min-height:48px}
.donehead .dck{flex:none;width:24px;height:24px;border-radius:7px;background:var(--good-soft);background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good);display:grid;place-items:center;font-size:13px;font-weight:700}
.donehead .dtx{flex:1;min-width:0;display:flex;flex-direction:column}.donehead .dtx b{font-weight:500;font-size:14px;color:var(--ink2)}
.donehead .dtx small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donefold.open .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.donelist{border-top:1px dashed var(--line)}
.dayrow.isdone .nm{color:var(--ink2);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.dayrow.isdone .box{opacity:.75}
.alldone{color:var(--ink2);text-align:center}
.acct{display:flex;align-items:center;gap:12px}
.acct .avatar{width:44px;height:44px;font-size:18px}
/* a task that keeps moving */
.slipcard{padding:12px 14px;margin:0 0 16px;border-radius:14px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 22%,transparent)}
.slipcard p{margin:0 0 10px;font-size:14px;line-height:1.45;color:var(--ink2)}.slipcard p b{color:var(--ink);font-weight:600}
.slipcard .chip{background:var(--surface)}
.islip{margin:0;padding:8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink2);font-size:13.5px}
/* 12-week goals: twelve marks, one per week */
.lgoal{color:var(--brass)}
.gtrack{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;width:100%}
.gtrack i{height:6px;border-radius:2px;background:var(--sunk)}
.gtrack.big i{height:12px;border-radius:3px}
.gtrack i.y{background:var(--brass)}
.gtrack i.h{background:linear-gradient(to top,var(--brass) 50%,var(--brass-soft) 50%)}
.gtrack i.n{background:var(--line);opacity:.7}
.gtrack i.now{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--brass)}
.gtrack i.ahead{opacity:.55}
.gsec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.gsech{display:flex;align-items:center;justify-content:space-between;gap:10px}.gsech b{font:600 17px var(--display)}
.goal{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:var(--lift)}
.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.gtop b{font-weight:600;line-height:1.3}.gtop small{flex:none;color:var(--brass);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.gsub{font-size:12.5px;color:var(--muted)}
.gstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 18px}
.gchip{display:flex;flex-direction:column;gap:7px;text-align:left;padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;box-shadow:var(--lift)}
.gct{display:flex;flex-direction:column;gap:1px;min-width:0}.gct b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gct small{font-size:12px;color:var(--muted)}
.gpast summary{font-size:13px;color:var(--muted);cursor:pointer}
.gprow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.gprow>span{display:flex;flex-direction:column}.gprow small{color:var(--muted);font-size:12.5px}.gprow .gtrack{grid-column:1/-1;grid-row:2}
.gwhen{margin:0;font-size:14px;color:var(--ink2)}
.gover{padding:12px 14px;border-radius:12px;background:var(--brass-soft)}.gover .row{margin-top:10px;justify-content:flex-start;gap:8px;flex-wrap:wrap}
.grev{display:flex;flex-direction:column;gap:16px}
.grow{display:flex;flex-direction:column;gap:8px}.grh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.grh .linkish{color:var(--ink);text-align:left}.grh small{flex:none;color:var(--muted);font-size:12.5px}
/* plan tomorrow: an evening card, then a sheet */
.plancard{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px;margin:0 0 16px;border-radius:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.plancard>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.plancard b{font:600 17px var(--display)}.plancard small{font-size:13px;color:var(--ink2)}
.planx{flex:none;width:40px;height:40px;border-radius:50%;color:var(--muted);font-size:18px}.planx:hover{background:var(--surface)}
.plfloors{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.5}.plfloors small{color:var(--muted)}
.plg{display:flex;flex-direction:column;gap:6px}
.plrow{display:flex;align-items:center;gap:8px;padding-right:8px}
.plrow + .plrow{border-top:1px solid var(--line)}
.plpick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 6px 12px 14px;text-align:left;color:var(--ink)}

/* ============ 12-week goals ============

   one. Kept in settings.goals: { id, t, v, when, start (a Monday), st: on | done | stopped, wk: { weekId: 0|1|2 }, end }. */

/* ============ plan tomorrow ============

/* ============ people together: invites, shared lists, watchers ============
   An invite is a long random link (invites/{token}) that says who sent it and to what: a list, being their watcher, or
   just Compass. Anyone with the link can see who sent it; joining needs signing in, and the database only lets someone
   in while the link is valid. Links last 14 days and can be stopped any time. */
const INV_DAYS = 14;
const randTok = () => { const a = new Uint8Array(24); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const inviteUrl = tok => location.origin + "/?invite=" + tok;
/* my live links, by purpose: a list id, "watch" or "app" */
function myInvite(key) { const x = (settings().inv || {})[key]; return x && x.exp > Date.now() + 864e5 ? x : null; }
async function makeInvite(key) {
  const have = myInvite(key); if (have) return have.t;
  const tok = randTok(), exp = Date.now() + INV_DAYS * 864e5;
  const d = { kind: key === "watch" ? "watch" : key === "app" ? "app" : "list", from: ST.uid, name: myName().slice(0, 60), exp, at: Date.now() };
  if (d.kind === "list") { d.list = key; d.listName = listName(key).slice(0, 80); d.gen = (L.meta[key] || {}).gen || 0; }
  if (d.kind === "watch") { d.watch = ST.uid; if (!W8.mine) await ensureWatchDoc(); d.gen = (W8.mine || {}).gen || 0; }
  await FB.setDoc(FB.doc(ST.fs, "invites", tok), d);
  editSettings(st => { st.inv = st.inv || {}; st.inv[key] = { t: tok, exp }; });
  return tok;
}
async function stopInvite(key) {
  const x = (settings().inv || {})[key]; if (!x) return;
  try { await FB.deleteDoc(FB.doc(ST.fs, "invites", x.t)); } catch (e) {}
  editSettings(st => { if (st.inv) delete st.inv[key]; });
}
const INVITE_TEXT = {
  list: (n, ln) => `${n} invited you to the list “${ln}” on Compass. Join to add and tick things together:`,
  watch: n => `${n} would like you as their accountability partner on Compass: you'd see how their week is going and can cheer them on.`,
  app: n => `${n} uses Compass to keep a few small weekly floors for what matters. Try it:`,
};
async function shareInvite(key, btn) {
  if (btn) btn.disabled = true;
  let tok; try { tok = await makeInvite(key); } catch (e) { if (btn) btn.disabled = false; toast("Couldn't make the link (" + (e && e.code || "error") + "). Try again."); return; }
  if (btn) btn.disabled = false;
  const url = inviteUrl(tok), kind = key === "watch" ? "watch" : key === "app" ? "app" : "list";
  const text = INVITE_TEXT[kind](firstName(myName()), listName(key));
  renderSheet(); render();
  if (navigator.share && matchMedia("(pointer:coarse)").matches) { try { await navigator.share({ title: "Compass", text, url }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  copyText(text + " " + url, "Invite link copied. Paste it in a message.");
}

    <div class="row" style="justify-content:flex-start;gap:8px"><button class="btn primary small" data-act="invMake" data-k="${esc(key)}">${navigator.share && matchMedia("(pointer:coarse)").matches ? "Share link" : "Copy link"}</button><button class="btn small quiet danger" data-act="invStop" data-k="${esc(key)}">Stop this link</button></div>
    <p class="hint" style="margin:0">Works for ${left} more day${left === 1 ? "" : "s"}. Anyone with the link can ${key === "watch" ? "become your watcher" : key === "app" ? "see that you invited them" : "join this list"}, so send it only to who you mean.</p></div>`;

  if (f.id === "newListForm") { const v = ($("#nlName").value || "").trim(); if (!v) { toast("Give the list a name."); return; } const lid = createList(v); setTv(lid); S.tab = "tasks"; S.sheet = null; toast(`Made “${v.slice(0, 40)}”. Add tasks above, or share it.`); render(); return; }
  if (f.id === "wNameForm") { const v = ($("#wName").value || "").trim().slice(0, 60); if (v) { editProfile(p => { p.name = v; }); publishName(v); toast("Saved"); } renderSheet(); return; }
  if (f.id === "pForm") { const name = $("#pName").value.trim(); if (!name) return; editPeople(p => { p.list.push({ id: uidGen(), name, tier: $("#pTier").value, last: null }); }); render(); const n = $("#pName"); if (n) n.focus(); }
  else if (f.id === "inForm") { const t = $("#inText").value.trim(); if (!t) return; editSettings(s => { s.inbox = (s.inbox || []).concat({ id: uidGen(), t }); }); render(); const n = $("#inText"); if (n) n.focus(); }
  else if (f.id === "obCustomValue") { const n = $("#obCv").value.trim(); if (!n) return; const id = "v-" + uidGen(); S.ob.d.custom.push({ id, name: n }); S.ob.d.values.push(id); updateOb(); }
  else if (f.classList.contains("obAdd")) { const inp = f.querySelector("input"), n = inp.value.trim(); if (!n) return; S.ob.d.comps.push({ id: "c-" + uidGen(), value: f.dataset.value, name: n, cadence: "weekly", target: 1, hours: 0.5, on: true, touched: true }); updateOb(); }
  else if (f.id === "obFunAdd") { const n = $("#obFunText").value.trim(); if (!n) return; S.ob.d.comps.push({ id: "fun-" + uidGen(), fun: true, name: n, cadence: "weekly", target: 0, hours: 0, on: true }); updateOb(); }
  else if (f.id === "customValueForm") { const n = $("#cvName").value.trim(); if (!n) return; const id = "v-" + uidGen(); editProfile(p => { p.customValues = (p.customValues || []).concat({ id, name: n }); p.values.push(id); }); S.sheet = { type: "pick", value: id }; render(); }
});
document.addEventListener("input", e => {
  const t = e.target, ds = t.dataset;
  if (t.id === "qAdd") { S.qDraft = t.value; if (!t.value) S.qIgnore = new Set(); refreshChips(); return; }
  if (t.id === "capSheet") { S.capDraft = t.value; const q = parseQuick(t.value), box = t.parentElement.querySelector(".qchips"); if (box) box.innerHTML = q.chips.map(c => `<span class="qchip ${c.k}">${esc(c.label)}</span>`).join(""); return; }
  if (ds.iv === "t" || ds.iv === "n") { clearTimeout(S.ivT); S.ivT = setTimeout(() => itemField(t), 500); return; }
  if (ds.mplan && !t.value) { setMonthPlan(ds.ym, ds.mplan, () => null); t.blur(); render(); return; }
  if (ds.j) editWeek(w => { dayObj(w, S.selDay).j[ds.j] = t.value; });
  else if (ds.r) editWeek(w => { w.r[ds.r] = t.value; });
  else if (ds.m) editSettings(s => { s.months = s.months || {}; const m = s.months[monthKey()] = s.months[monthKey()] || {}; m[ds.m] = t.value; });
  else if (ds.p === "goal") editProfile(p => { p.goal = t.value; });
  else if (ds.p === "ifthen") editProfile(p => { p.ifthen = t.value.split("\n"); });
  else if (ds.core !== undefined) editProfile(p => { if (p.cores[+ds.core]) p.cores[+ds.core].text = t.value; });
  else if (ds.ob === "goal") { S.ob.d.goal = t.value; saveDraft(); if (!CSS.supports("field-sizing", "content")) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; } }
  else if (ds.ob === "ifthen") { S.ob.d.ifthen = t.value.split("\n"); saveDraft(); }
  else if (ds.obe && S.ob) { const c = S.ob.d.comps.find(x => x.id === S.obEdit); if (c) c[ds.obe] = t.value;  saveDraft(); }
  else if (ds.gd && S.sheet && S.sheet.type === "goalEdit") { S.sheet.draft[ds.gd] = t.value; }
  else if (ds.fx && S.sheet && S.sheet.type === "fixed" && ds.fx !== "dur") { S.sheet.draft[ds.fx] = t.value; }
  else if (ds.fx === "dur" && S.sheet && S.sheet.type === "fixed") { const h = parseDur(t.value); if (h !== null) S.sheet.draft.dur = Math.max(15, Math.round(h * 60)); }
  else if (ds.obcore !== undefined) { const c = S.ob.d.cores[+ds.obcore]; if (c) c.text = t.value;  saveDraft(); }
  else if (ds.fb && S.sheet && S.sheet.type === "feedback") { S.sheet.text = t.value; const n = t.nextElementSibling; if (n) n.textContent = t.value.length + "/2000"; const btn = document.querySelector('[data-act="fbSend"]'); if (btn) btn.disabled = !t.value.trim(); }
  else if (ds.c === "mins" && S.sheet && S.sheet.draft) { S.sheet.draft.hours = Math.min(720, Math.max(0, Number(t.value) || 0)) / 60; }
  else if (ds.c && S.sheet && S.sheet.draft) { S.sheet.draft[ds.c] = ds.c === "hours" ? Math.max(0, Number(t.value) || 0) : t.value; }
  else if (ds.cb && S.sheet && S.sheet.draft && S.sheet.draft.block) { S.sheet.draft.block[ds.cb] = ds.cb === "dur" ? Math.max(5, Number(t.value) || 30) : t.value; S.sheet.draft.gcal = false; }
  else if (ds.cap) {
    const v = +t.value;
    if (S.ob) { S.ob.d.capacity = v; } else editProfile(p => { p.capacity = v; });
    document.querySelectorAll("[data-budget]").forEach(el => { el.textContent = v + " h"; });
  }
});
document.addEventListener("change", e => {
  if (e.target && e.target.dataset && e.target.dataset.nt) { ntSet(e.target.dataset.nt, e.target.value); return; }
  if (e.target && e.target.dataset && e.target.dataset.iv) { clearTimeout(S.ivT); itemField(e.target); return; }
  if (e.target && e.target.dataset && e.target.dataset.plantm) { const [l, id] = e.target.dataset.plantm.split("/"); updItem(l, id, { tm: e.target.value || null }); renderSheet(); return; }   // title and note: the list behind redraws when the sheet closes
  if (e.target && e.target.id === "sortDate" && e.target.value) { sortPick("date", e.target.value); burst(e.target, "var(--accent)", 6); render(); return; }
  const t = e.target, ds = t.dataset;
  if (ds.mplan) {
    const cid = ds.mplan, v = t.value, oldYm = ds.ym, newYm = v ? v.slice(0, 7) : oldYm;
    const keep = (monthPlan(oldYm)[cid] || {}).time || "";
    if (oldYm && oldYm !== newYm) setMonthPlan(oldYm, cid, () => null);
    setMonthPlan(newYm, cid, cur => v ? Object.assign(cur, { date: v }, keep && !cur.time ? { time: keep } : {}) : null);
    render(); return;
  }
  if ((ds.tgt || ds.dur) && S.ob) {
    const c = S.ob.d.comps.find(x => x.id === (ds.tgt || ds.dur)); if (!c) return;
    if (ds.tgt) { const n = parseFloat(String(t.value).replace(",", ".")); if (isFinite(n) && n > 0) setFreq(c, n); else toast("Type a number, like 3"); }
    else { const h = parseDur(t.value); if (h === null) toast("Try something like 45 min, 1 h 30 or 1:30"); else { c.hours = Math.max(0, Math.min(12, Math.round(h * 60) / 60)); c.touched = true; } }
    updateOb(); return;
  }
  if (ds.cap) { if (S.ob) updateOb(); else render(); return; }
  if (t.id === "impFiles" && t.files && t.files.length) { impAddFiles([...t.files]); t.value = ""; return; }
  if (ds.wkt) { const tgt = S.ob && !S.sheet ? (S.ob.d.week = S.ob.d.week || Object.assign({}, WEEK_DEFAULT)) : S.sheet && S.sheet.type === "week" ? S.sheet.draft : null; if (tgt && t.value) { tgt[ds.wkt] = t.value; if (S.ob && !S.sheet) updateOb(); else renderSheet(); } return; }
  if (ds.impu !== undefined && S.imp && S.imp.sel) { S.imp.sel.unplaced[+ds.impu] = t.value; return; }
  if (t.id === "restoreFile" && t.files && t.files[0]) { readBackup(t.files[0]); t.value = ""; return; }
  if (ds.c === "value" && S.sheet && S.sheet.draft) S.sheet.draft.value = t.value;
  else if (ds.cfrom && S.sheet && S.sheet.draft) { S.sheet.draft.from = t.value; S.sheet.draft.gcal = false; renderSheet(); }
  else if (ds.j || ds.cap) scheduleRender();
});
document.addEventListener("keydown", e => {
  const t = e.target, typing = t && /^(TEXTAREA|INPUT|SELECT)$/.test(t.tagName);
  if (typing && t.id === "qAdd" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); const btn = document.querySelector('[data-act="capAdd"][data-src="qAdd"]'); if (btn) btn.click(); return; }
  if (typing && t.id === "iTitle" && e.key === "Enter") { e.preventDefault(); t.blur(); return; }
  if (typing && t.tagName === "TEXTAREA" && t.closest(".capbox") && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); const btn = t.closest(".capbox").querySelector('[data-act="capAdd"]'); if (btn) btn.click(); return; }
  if (typing && (t.dataset.tgt || t.dataset.dur) && e.key === "Enter") { e.preventDefault(); t.blur(); return; }
  if (typing && (t.id === "obe-name" || t.id === "obe-note") && e.key === "Enter") { e.preventDefault(); const btn = document.querySelector('[data-act="obEditDone"]'); if (btn) btn.click(); return; }
  if (e.key === "Escape" && S.sheet) { if (S.sheet.type === "item") { clearTimeout(S.ivT); ["iTitle", "iNote"].forEach(x => { const el = $("#" + x); if (el) itemField(el); }); } S.sheet = null; if (S.ob) renderSheet(); else render(); return; }
  if (!typing && S.sheet && S.sheet.type === "sort") {
    if (e.key === "4") { const d = $("#sortDate"); if (d) { e.preventDefault(); d.focus(); try { d.showPicker(); } catch (x) {} } return; }
    const map = { "1": "done", "2": "today", "3": "week", "5": "list", "6": "recurring", "7": "someday", "8": "drop", s: "skip", S: "skip" };
    const k = map[e.key]; if (k) { const btn = document.querySelector(`[data-act="sortPick"][data-k="${k}"]`); if (btn) { e.preventDefault(); btn.click(); } }
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { if (S.selDay !== todayKey() && dkey(S.viewMon) === dkey(monday(new Date()))) S.selDay = todayKey(); scheduleRender(); }
});

init();
</script>
</body>
