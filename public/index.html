<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F2">
<meta name="description" content="Compass turns what matters to you into a few small weekly floors, and shows whether your life is trending the right way.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compass">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Compass · Know where your life is heading</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://life-compass.web.app/">
<meta property="og:title" content="Compass · Know where your life is heading">
<meta property="og:description" content="A few small weekly floors, a Sunday check-in and a safety net for hard weeks. Free, private, grounded in research.">
<meta property="og:image" content="https://life-compass.web.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EDEA; --ink:#17201E; --ink2:#46524E; --muted:#6F7B77; --line:#D9DFDB;
  --accent:#23466F; --accent-soft:#E2E9F3; --on-accent:#FFFFFF; --brass:#A36F1C; --brass-soft:#F4EAD8;
  --good:#2C7552; --good-soft:#DFEFE5; --warn:#A8620E; --warn-soft:#F6E9D6; --scrim:rgba(18,26,24,.38);
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101514; --surface:#191F1E; --sunk:#232B29; --ink:#E7ECEA; --ink2:#B4BEBA; --muted:#88938F; --line:#2D3533;
    --accent:#93B3DC; --accent-soft:#1E2A39; --on-accent:#0D1623; --brass:#D8A75C; --brass-soft:#33291A;
    --good:#72C69D; --good-soft:#16302A; --warn:#E3A65C; --warn-soft:#33281A; --scrim:rgba(0,0,0,.55);--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101514; --surface:#191F1E; --sunk:#232B29; --ink:#E7ECEA; --ink2:#B4BEBA; --muted:#88938F; --line:#2D3533;
  --accent:#93B3DC; --accent-soft:#1E2A39; --on-accent:#0D1623; --brass:#D8A75C; --brass-soft:#33291A;
  --good:#72C69D; --good-soft:#16302A; --warn:#E3A65C; --warn-soft:#33281A; --scrim:rgba(0,0,0,.55);--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:600px;margin:0 auto;padding-block:8px 110px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:600 22px/1 var(--display);letter-spacing:-.01em}
.brand svg{width:28px;height:28px;overflow:visible}
.hneedle{transform-box:view-box;transform-origin:16px 16px;--tilt:0deg;--amp:3deg;animation:wobble 3.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(calc(var(--tilt) - var(--amp)))}50%{transform:rotate(calc(var(--tilt) + var(--amp)))}}
.weeknav{display:flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.weeknav button{width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--ink2)}
.weeknav button:hover{background:var(--sunk)}
.weeknav .lbl{min-width:118px;text-align:center;font-weight:500}
.weeknav .lbl small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.04em;text-transform:uppercase}
.statusline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-block:0 10px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--brass)}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin-block:0 12px}

/* type */
h1{font:600 34px/1.08 var(--display);margin:10px 0 8px;letter-spacing:-.015em;text-wrap:balance}
h2{font:600 24px/1.15 var(--display);margin:18px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 8px}
.lede{color:var(--ink2);margin:0 0 6px;max-width:62ch}
.hint{font-size:13px;color:var(--muted)}
.src{font-size:11.5px;color:var(--muted);font-style:italic}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card + .card{margin-top:10px}
.pad{padding:14px}

/* day strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:10px;font-variant-numeric:tabular-nums}
.strip .wd{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.strip .ring{--p:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);font-weight:600;font-size:13px;transition:--p .4s}
.strip .ring span{width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.strip .ring.full{background:var(--good)}
.strip button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.strip button.today .wd{color:var(--brass);font-weight:600}
.strip button:disabled{opacity:.35}

/* check rows */
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;min-height:52px}
.check + .check{border-top:1px solid var(--line)}
.check .box{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);animation:pop .28s cubic-bezier(.3,1.7,.5,1)}
.check[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check .lbl{display:flex;flex-direction:column;min-width:0}
.check .lbl small{color:var(--muted);font-size:12.5px}
.check .tail{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

/* journal & fields */
.jf,.field{display:flex;flex-direction:column;gap:4px;padding:12px 14px}
.jf + .jf,.field + .field{border-top:1px solid var(--line)}
.jf label,.field label,.flabel{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
textarea,input[type=text],select,input[type=time],input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;resize:vertical}
textarea{min-height:44px}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:8px;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px 8px 10px;font-size:14px;min-height:40px;transition:transform .12s}
.chip b{font-weight:600;color:var(--accent)}
.chip .n{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.chip.done{background:var(--good-soft);border-color:transparent}
.chip.done .n{color:var(--good)}
.chip.fun{background:var(--brass-soft);border-color:transparent}
.chip.fun b{color:var(--brass)}
.chip:active{transform:scale(.95)}
.chip.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.sel b{color:var(--on-accent)}

/* values */
.val{padding:12px 14px}
.val + .val{border-top:1px solid var(--line)}
.vhead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.vhead b{font-weight:600}
.core{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--brass);margin-left:6px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-block}
.pill.clear{background:var(--good-soft);color:var(--good)}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.missed{background:var(--warn-soft);color:var(--warn)}
.pill.rest{background:var(--sunk);color:var(--muted)}
.pill.stamp{animation:stamp .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.floors{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px}
.floors li{display:flex;gap:8px;font-size:13.5px;color:var(--ink2)}
.floors li span:first-child{flex:1}
.floors li .f{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.floors li.ok{color:var(--muted)} .floors li.ok .f{color:var(--good)}

/* counters */
.ctr{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px}
.ctr + .ctr{border-top:1px solid var(--line)}
.ctr .lbl{flex:1;display:flex;flex-direction:column;min-width:0}
.ctr .lbl small{color:var(--muted);font-size:12.5px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--sunk);font-size:18px;line-height:1}
.stepper button.plus{background:var(--accent);color:var(--on-accent)}
.stepper .v{min-width:52px;text-align:center;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.stepper .v.met{color:var(--good)}

.row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--sunk);flex:none;transition:background .15s;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-weight:500;border:1px solid var(--line);background:var(--surface);min-height:40px;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.quiet{border-color:transparent;color:var(--ink2);padding-inline:8px;background:transparent}
.btn.danger{color:var(--warn)}
.btn.small{min-height:32px;padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.5}
.linkbtn{color:var(--accent);font-weight:500;text-decoration:none;white-space:nowrap}
.linkbtn:hover{text-decoration:underline}

/* felt */
.felt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.felt button{border:1px solid var(--line);border-radius:10px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface)}
.felt button b{font:600 22px/1 var(--display)}
.felt button small{font-size:11px;color:var(--muted)}
.felt button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:pop .28s cubic-bezier(.3,1.7,.5,1)}
.felt button[aria-pressed="true"] small{color:var(--on-accent);opacity:.8}

.trip{border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:0 var(--r) var(--r) 0;padding:10px 12px;font-size:14px}
.trip + .trip{margin-top:6px}
.spark{width:100%;height:auto;display:block}
.spark text{fill:var(--muted);font:500 10px var(--mono)}

/* suggestions */
.sugg{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.sugg + .sugg{border-top:1px solid var(--line)}
.sugg .glyph{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brass-soft);display:grid;place-items:center}
.sugg .glyph svg{width:16px;height:16px;stroke:var(--brass);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sugg .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sugg .body b{font-weight:600}
.sugg .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.coach{white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--muted)}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--brass);animation:bounce 1s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}

/* people */
.person{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px}
.person + .person{border-top:1px solid var(--line)}
.person .who{flex:1;min-width:0}
.person .who b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .who small{color:var(--muted);font-size:12.5px}
.due{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.due.over{background:var(--warn-soft);color:var(--warn)} .due.now{background:var(--accent-soft);color:var(--accent)} .due.later{background:var(--sunk);color:var(--muted)}
.addrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:12px 14px}
@media (max-width:420px){.addrow.three{grid-template-columns:1fr 1fr}.addrow.three input{grid-column:1/-1}}

/* component rows (design) */
.comp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;min-height:54px}
.comp + .comp{border-top:1px solid var(--line)}
.comp .lbl{flex:1;min-width:0;display:flex;flex-direction:column}
.comp .lbl small{color:var(--muted);font-size:12.5px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.mvw{background:var(--accent-soft);color:var(--accent)} .tag.fun{background:var(--brass-soft);color:var(--brass)} .tag.ai{background:var(--good-soft);color:var(--good)}
.chev{color:var(--muted);font-size:18px}
.vgroup{margin-top:14px}
.vgroup .gh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.vgroup .gh b{font:600 18px/1.2 var(--display)}

/* meter */
.meter{padding:12px 14px}
.meter .bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;margin:8px 0 6px}
.meter .fill{height:100%;border-radius:999px;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s}
.meter.over .fill{background:var(--warn)}
.meter .nums{display:flex;flex-wrap:wrap;gap:2px 12px;justify-content:space-between;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:90vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 4px}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .fl{display:flex;flex-direction:column;gap:4px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daypick button{border:1px solid var(--line);border-radius:8px;padding:7px 0;font-size:12.5px}
.daypick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* onboarding */
.ob{padding-block:8px 20px}
.ob .stepin{animation:rise .4s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.progress{display:flex;gap:6px;margin:6px 0 8px}
.progress i{height:4px;flex:1;border-radius:2px;background:var(--line);transition:background .3s}
.progress i.on{background:var(--accent)}
.hero{display:grid;place-items:center;padding-block:12px 4px}
.hero svg{width:min(190px,52vw);height:auto;overflow:visible}
.bneedle{transform-box:view-box;transform-origin:100px 100px;animation:seek 2.4s cubic-bezier(.3,.9,.3,1) both}
@keyframes seek{0%{transform:rotate(-120deg)}25%{transform:rotate(70deg)}45%{transform:rotate(-35deg)}62%{transform:rotate(18deg)}78%{transform:rotate(-7deg)}90%{transform:rotate(3deg)}100%{transform:rotate(0)}}
.ringpulse{transform-box:view-box;transform-origin:100px 100px;animation:pulse 2.4s ease-out 1.8s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.feel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media (max-width:440px){.vcards{grid-template-columns:1fr}}
.vcard{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px;transition:transform .18s cubic-bezier(.3,1.6,.5,1),border-color .15s,background .15s}
.vcard b{font-weight:600;padding-right:26px}
.vcard small{color:var(--ink2);font-size:13px}
.vcard .src{margin-top:2px}
.vcard .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.vcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.015)}
.vcard[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);animation:pop .3s cubic-bezier(.3,1.7,.5,1)}
.vcard[aria-pressed="true"] .tick::after{content:"";width:5px;height:9px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.vcard.corecard[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft)}
.vcard.corecard[aria-pressed="true"] .tick{background:var(--brass);border-color:var(--brass)}
.route{display:grid;gap:10px;margin-top:12px}
.route .card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.route .step{display:flex;gap:12px;padding:14px}
.route .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 15px var(--display)}
.route .step b{display:block;font-weight:600;margin-bottom:2px}
.obbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.obbar .in{max-width:600px;margin:0 auto;display:flex;gap:10px;justify-content:space-between;align-items:center}
.stickymeter{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:8px 16px;background:var(--bg)}

/* themes */
body{transition:background-color .35s ease,color .35s ease}
.card,.chip,.tabbar,.obbar,.sheet{transition:background-color .35s ease,border-color .35s ease}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--ink2)}
.swatch .dot{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--sw-surface),0 0 0 1px var(--line);background:linear-gradient(135deg,var(--sw-accent) 0 52%,var(--sw-brass) 52% 100%)}
.swatch[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--accent)}
.swatch[aria-pressed="true"] .dot{animation:pop .35s cubic-bezier(.3,1.7,.5,1)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;color:var(--muted);border-radius:10px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent);font-weight:600}
.tabbar .dot{position:absolute;top:4px;left:calc(50% + 8px);width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* bursts & celebration */
.burst{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:50;animation:fly .65s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.toast.withundo{display:flex;align-items:center;gap:14px;padding:6px 6px 6px 16px}
.toast.withundo button{background:transparent;color:var(--bg);font-weight:600;padding:6px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(146px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13.5px;z-index:40;animation:rise .3s;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---------- landing ---------- */
html{scroll-behavior:smooth}
body.landing .wrap{max-width:1120px;padding-block:0 32px}
body.landing .top,body.landing #statusline{display:none}
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.lnav .brand svg{width:26px;height:26px}
.lnav .links{display:flex;gap:26px;font-size:14.5px}
.lnav .links a{color:var(--ink2);text-decoration:none}
.lnav .links a:hover{color:var(--ink)}
@media (max-width:820px){.lnav .links{display:none}}
.navcta{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px}
.navcta svg{width:16px;height:16px}
.eyebrow{display:block;font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.lhero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding-block:44px 80px}
.lhero h1{font:600 clamp(42px,6.2vw,74px)/1.02 var(--display);letter-spacing:-.028em;margin:16px 0 20px;text-wrap:balance}
.big{font-size:clamp(17px,1.55vw,19.5px);line-height:1.55;color:var(--ink2);max-width:33em;margin:0}
.ctas{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:28px}
.ctas .gbtn{margin-top:0}
.textlink{color:var(--accent);font-weight:500;text-decoration:none}
.textlink:hover{text-decoration:underline}
.meta{margin-top:20px;font-size:13.5px;color:var(--muted);display:flex;gap:6px 16px;flex-wrap:wrap}
.meta span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:7px;vertical-align:middle}
@media (max-width:880px){.lhero{grid-template-columns:1fr;gap:40px;padding-block:24px 56px}}
.demo{position:relative;padding:28px}
.demo .halo{position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--line);pointer-events:none}
.dcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 70px -30px rgba(15,25,35,.32);padding:18px 20px 8px;max-width:440px;margin-inline:auto}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:10px}
.dhead b{font:600 19px/1.2 var(--display)}
.dhead small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.dneedle{width:46px;height:46px;flex:none}
.dneedle g{transform-box:view-box;transform-origin:23px 23px;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.drow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.drow .n{font-weight:600;font-size:14.5px}
.drow .c{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px;grid-column:1/-1}
.dots i{width:100%;max-width:34px;height:7px;border-radius:4px;background:var(--sunk);transition:background .35s}
.dots i.on{background:var(--accent)}
.drow.done .dots i.on{background:var(--good)}
.dfoot{font-size:12px;color:var(--muted);padding:10px 0 8px;border-top:1px solid var(--line)}
.lsec{padding-block:80px;border-top:1px solid var(--line)}
.lsec h2{font:600 clamp(30px,4vw,46px)/1.08 var(--display);letter-spacing:-.02em;margin:14px 0 14px;max-width:17em;text-wrap:balance}
.lsec .big{margin-bottom:36px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid3,.grid2{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px}
.tile h3{font:600 20px/1.2 var(--display);letter-spacing:-.01em;color:var(--ink);text-transform:none;margin:0}
.tile p{margin:0;color:var(--ink2);line-height:1.55}
.tile cite{font-style:italic;font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:6px}
.stepnum{font:600 12.5px/1 var(--mono);color:var(--brass);letter-spacing:.06em}
.viz{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.viz .chip{min-height:32px;padding:5px 11px;font-size:13px}
.vline{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding-block:3px}
.vline span:last-child{font-family:var(--mono);font-size:12px;color:var(--muted)}
.vbar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.vbar i{display:block;height:100%;width:45%;background:var(--accent);border-radius:999px}
.vfelt{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.vfelt span{border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 0;font:600 16px var(--display);background:var(--surface)}
.vfelt span.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.vs{grid-template-columns:1fr}}
.vscol{border-radius:16px;padding:22px;border:1px solid var(--line)}
.vscol.them{background:transparent}
.vscol.us{background:var(--surface);box-shadow:0 0 0 1.5px var(--accent)}
.vscol b{font:600 19px var(--display)}
.vscol ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.vscol li{display:flex;gap:10px;line-height:1.45;color:var(--ink2)}
.vscol li::before{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vscol.them li::before{content:"✕";background:var(--sunk);color:var(--muted)}
.vscol.us li::before{content:"✓";background:var(--good-soft);color:var(--good)}
.note{font-size:13.5px;color:var(--muted);margin-top:22px;max-width:60ch}
.faq{display:grid;gap:10px;max-width:760px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 18px}
.faq summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--muted);font-weight:400;font-size:20px;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0 0 16px;color:var(--ink2);line-height:1.55}
.finale{text-align:center;padding-block:90px 70px;border-top:1px solid var(--line)}
.finale h2{margin-inline:auto}
.finale .ctas{justify-content:center}
.lfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-block:22px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* ---------- your week ---------- */
.waffle{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin:10px 0 8px}
.waffle i{aspect-ratio:1;border-radius:2px;display:block}
.wlegend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px}
@media (max-width:420px){.wlegend{grid-template-columns:1fr}}
.wlegend li{display:flex;align-items:center;gap:8px}
.wlegend li i{width:10px;height:10px;border-radius:2px;flex:none}
.wlegend li span{flex:1;color:var(--ink2)}
.wlegend li b{font:600 12.5px var(--mono)}
.obrow + .obrow{border-top:1px solid var(--line)}
.obrow .check{border:0}
.obtop{display:flex;align-items:center}
.obtop .check{flex:1;min-width:0}
.xbtn{flex:none;width:34px;height:34px;margin-right:8px;border-radius:50%;color:var(--muted);font-size:14px}
.xbtn:hover{background:var(--sunk);color:var(--warn)}
.obedit{display:grid;gap:8px;padding:0 14px 14px 50px}
.undo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--sunk);font-size:13.5px;color:var(--ink2)}
.tune{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:0 14px 12px 50px;font-size:13px}
.stp{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:2px}
.stp button{width:26px;height:26px;border-radius:50%;font-size:15px;line-height:1;background:var(--surface)}
.stp span{min-width:74px;text-align:center;font:500 12.5px var(--mono);white-space:nowrap}
.tune .eq{font:600 12.5px var(--mono);color:var(--ink2)}

/* ---------- allocation ---------- */
.tier{margin:26px 0 -4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--brass)}
.tier span{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);margin-left:6px}
.sbar{position:relative;display:flex;gap:2px;height:12px;border-radius:999px;background:var(--sunk);margin:10px 0 8px;overflow:visible}
.sbar i{display:block;height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.sbar i:first-child{border-radius:999px 0 0 999px}
.sbar i:last-of-type{border-radius:0 999px 999px 0}
.sbar i:only-of-type{border-radius:999px}
.sbar .bmark{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.mstat{font-size:13px;color:var(--good);font-weight:500}
.mstat.bad{color:var(--warn)}
.meter .nums b{font-family:var(--mono);font-weight:600}
.vdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px;flex:none}
.alloc{font-size:13px;white-space:nowrap}
.alloc b{font:600 13px var(--mono)}
.gbar{height:3px;border-radius:2px;background:var(--sunk);margin:-2px 0 8px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:2px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.sumpill{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin:0 14px 12px 50px;padding:6px 12px;border-radius:999px;background:var(--sunk);font-size:13px;color:var(--ink2);text-align:left;max-width:calc(100% - 64px)}
.sumpill b{font:600 12.5px var(--mono);color:var(--ink);white-space:nowrap}
.sumpill .pen{color:var(--accent);font-weight:600;margin-left:2px}
.sumpill:hover{background:var(--line)}
.tunegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.tunegrid{grid-template-columns:1fr}}
.tunegrid .fl{display:flex;flex-direction:column;gap:4px}
.stp2{display:flex;align-items:center;gap:4px;background:var(--sunk);border-radius:12px;padding:3px}
.stp2 button{width:32px;height:32px;border-radius:9px;background:var(--surface);font-size:16px;flex:none}
.stp2 input{flex:1;min-width:0;border:0;background:transparent;text-align:center;font:600 14px var(--mono);padding:6px 2px;color:var(--ink)}
.stp2 input:focus{outline:2px solid var(--accent);border-radius:8px}
.stp2 .suf{font:500 12px var(--mono);color:var(--muted);padding-right:6px;white-space:nowrap}
.eqline{font:600 13px var(--mono);color:var(--ink2)}

/* ---------- load breakdown ---------- */
.explain{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:10px}
.explain p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.brk{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.brow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 10px;font-size:13.5px}
.brow + .brow{border-top:1px solid var(--line)}
.brow .nm{min-width:0}
.brow .nm small{display:block;color:var(--muted);font:500 11.5px var(--mono)}
.brow .wk{font:600 13px var(--mono);white-space:nowrap}
.brow .adj{display:flex;gap:4px}
.brow .adj button{width:28px;height:28px;border-radius:50%;background:var(--sunk);font-size:15px;line-height:1}
.brow.tot{background:var(--surface);font-weight:600}
.linkish{color:var(--accent);font-weight:500;font-size:13.5px;padding:4px 0}

.updbar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px -12px rgba(0,0,0,.4);border-radius:999px;padding:6px 6px 6px 16px;font-size:13.5px;max-width:calc(100% - 32px);animation:rise .3s}
/* ---------- tasks ---------- */
.fab{position:fixed;right:max(16px,calc(50% - 300px + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:12;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(10,20,30,.45);transition:transform .15s}
.fab:active{transform:scale(.92)}
.capbox{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.capbox textarea{min-height:72px}
.capbox .row{gap:8px}
.inboxcta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:var(--brass-soft);border-radius:var(--r)}
.inboxcta b{font:600 18px/1.2 var(--display)}
.task{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:52px}
.task + .task{border-top:1px solid var(--line)}
.task .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.task .tx small{color:var(--muted);font-size:12.5px}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center}
.tick:hover{border-color:var(--accent)}
.tick.on{background:var(--good);border-color:var(--good)}
.tick.on::after{content:"";width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.tag.core{background:var(--brass-soft);color:var(--brass)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
details.fold{margin-top:10px}
details.fold summary{cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 0;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"▸ ";}
details.fold[open] summary::before{content:"▾ ";}
.stepin2{display:flex;gap:8px;margin-top:6px}
.sortcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:0 18px 40px -24px rgba(10,20,30,.4);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.sortcard .q{font:600 22px/1.25 var(--display);letter-spacing:-.01em;word-break:break-word}
.sortgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:58px}
.sbtn b{font-weight:600;font-size:14.5px}
.sbtn small{color:var(--muted);font-size:12px;line-height:1.3}
.sbtn kbd{position:absolute;top:8px;right:9px;font:500 10.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.sbtn.sug{border-color:var(--brass);box-shadow:0 0 0 1.5px var(--brass)}
.sbtn.sug::before{content:"Suggested";position:absolute;top:-9px;left:10px;background:var(--brass);color:var(--on-accent);font-size:10px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:5px}
.sbtn:hover{border-color:var(--accent)}
.sbtn.full{grid-column:1/-1}
@media (hover:none){.sbtn kbd{display:none}}
.meterline{display:flex;gap:6px;align-items:center}
.meterline i{width:22px;height:6px;border-radius:3px;background:var(--sunk)}
.meterline i.on{background:var(--accent)}

/* ---------- landing: tour ---------- */
.tour{display:grid;grid-template-columns:1fr auto;gap:48px;align-items:center;margin-top:30px}
@media (max-width:880px){.tour{grid-template-columns:1fr;gap:24px}.tour .phone{order:-1;margin-inline:auto}}
.tsteps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tsteps button{width:100%;text-align:left;border-radius:14px;padding:14px 16px;display:grid;gap:4px;border:1px solid transparent;transition:background .2s,border-color .2s}
.tsteps button b{font:600 18px/1.2 var(--display)}
.tsteps button span{color:var(--muted);font-size:14px}
.tsteps button[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.tsteps button[aria-current="true"] span{color:var(--ink2)}
.tbar{display:block;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;width:0;background:var(--accent)}
.tsteps button[aria-current="true"] .tbar i{animation:tprog var(--tdur,6s) linear forwards}
.tour.still .tsteps button[aria-current="true"] .tbar i{animation:none;width:100%}
@keyframes tprog{to{width:100%}}
@media (max-width:880px){.tsteps{grid-template-columns:repeat(3,1fr)}.tsteps button{padding:10px}.tsteps button b{font-size:14.5px}.tsteps button span{display:none}}

.pscreen{height:100%;border-radius:31px;background:var(--bg);overflow:hidden;padding:26px 14px 14px;position:relative;font-size:13px;display:flex;flex-direction:column;gap:9px}
.pscreen .pt{font:600 20px/1.15 var(--display)}
.pscreen .ps{color:var(--muted);font-size:12px}
.pscreen .card{border-radius:12px}
.pscreen .mini{display:flex;align-items:center;gap:9px;padding:8px 10px;font-size:13px}
.pscreen .mini + .mini{border-top:1px solid var(--line)}
.pscreen .mbox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;transition:all .25s}
.pscreen .mbox.on{background:var(--accent);border-color:var(--accent)}
.pscreen .mbox.on::after{content:"";width:4px;height:8px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.pscreen .vgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pscreen .vc{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-size:12px;font-weight:600;transition:all .25s}
.pscreen .vc.on{background:var(--accent-soft);border-color:var(--accent);transform:scale(1.03)}
.pscreen .tin{opacity:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) forwards}
.pscreen .typing{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;min-height:38px;font-size:13px}
.pscreen .typing::after{content:"";display:inline-block;width:1.5px;height:14px;background:var(--accent);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pscreen .bkts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:auto}
.pscreen .bk{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 4px;text-align:center;font-size:10.5px;color:var(--muted);transition:all .25s}
.pscreen .bk b{display:block;font:600 18px var(--display);color:var(--ink)}
.pscreen .bk.hit{border-color:var(--accent);background:var(--accent-soft)}
.pscreen .scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font:600 17px/1.25 var(--display);transition:transform .35s ease,opacity .35s ease}
.pscreen .scard.out{transform:translateX(120%) rotate(8deg);opacity:0}
.pscreen .sopts{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pscreen .so{border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:11.5px;font-weight:600;background:var(--surface);transition:all .2s}
.pscreen .so.pick{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pscreen .pill{font-size:10.5px}
.pscreen .spk path{stroke-dasharray:260;stroke-dashoffset:260;transition:stroke-dashoffset 1.6s ease}
.pscreen .spk.draw path{stroke-dashoffset:0}

    ${mvw ? `<p class="hint" style="margin:0 0 6px">Optional during a Minimum Viable Week.</p>` : ""}
    <div class="card">${wk.map(i => taskRow(i)).join("")}
      ${steps.map(p => `<div class="task"><button class="tick" data-act="tStep" data-id="${p.id}" aria-label="Next step done"></button><div class="tx"><span>${esc(p.next)}</span><span class="tags" style="margin-top:3px"><span class="tag core">${esc(p.t)}</span></span></div></div>`).join("")}
      ${n ? `<button class="comp" data-act="sortStart"><span class="lbl"><span>${n} thought${n > 1 ? "s" : ""} in your inbox</span><small>Sort them so they stop circling</small></span><span class="chev">›</span></button>` : ""}

}
function rToday(id) {

  const daily = act.filter(c => c.cadence === "daily");
  const strip = keys.map((k, i) => {
    const d = (w.days || {})[k] || {};
    const n = daily.filter(c => c.auto === "journal" ? hasJournal(d) : (d.a || {})[c.id]).length, tot = Math.max(daily.length, 1);
    const p = Math.round(n / tot * 100);

      <span class="wd">${WD[i]}</span><span class="ring ${p >= 100 ? "full" : ""}" style="--p:${p}"><span>${parse(k).getDate()}</span></span></button>`;
  }).join("");

  const chip = c => { const v = compHave(c, w, id), need = c.target; return `<button class="chip ${v >= need ? "done" : ""}" data-act="inc" data-k="${esc(c.id)}"><b>+</b>${esc(c.name)}<span class="n">${v}${c.unit || ""}/${need}${c.unit || ""}</span></button>`; };
  const weekly = act.filter(c => c.cadence === "weekly"), monthly = act.filter(c => c.cadence === "monthly");
  const fun = comps().filter(c => c.fun);
  const funCount = fun.reduce((s, c) => s + ((w.c || {})[c.id] || 0), 0);
  const jc = daily.find(c => c.auto === "journal");
  const hr = new Date().getHours(), part = hr < 5 ? "evening" : hr < 12 ? "morning" : hr < 17 ? "afternoon" : "evening";
  const first = ((S.user && S.user.name) || "").split(" ")[0];
  return `
  ${S.selDay === tk ? `<p class="greet">Good ${part}${first ? ", " + esc(first) : ""}.</p>` : ""}
  <div class="strip" role="group" aria-label="Days of this week">${strip}</div>

  ${weekly.length ? `<h3>Log for the week</h3><div class="chips">${weekly.map(chip).join("")}</div>` : ""}

      <div class="seg" role="group"><button data-act="cp" data-v="toward" aria-pressed="${d.cp === "toward"}">Toward</button><button data-act="cp" data-v="away" aria-pressed="${d.cp === "away"}">Away</button><button data-act="cp" data-v="mixed" aria-pressed="${d.cp === "mixed"}">Mixed</button></div></div>

/* ============ WEEK ============ */

}
function rWeek(id, F, trips, sugg) {

  ${alts.length ? `<div class="card pad"><div class="row"><div><b>Week ${kind}</b><div class="hint">Alternating: ${alts.map(c => esc(c.name) + " (" + c.alt + ")").join(", ")}.</div></div><button class="btn" data-act="swapKind">Swap</button></div></div>` : ""}
  ${id === thisWk() && (titems().length) ? `<h3>Open loops</h3><div class="card pad"><ul class="floors" style="margin:0">
    <li class="${weekErrands().length === 0 && doneErrandsThisWeek().length ? "ok" : ""}"><span>Errands this week</span><span class="f">${doneErrandsThisWeek().length}/${weekErrands().length + doneErrandsThisWeek().length}</span></li>

/* ============ PEOPLE ============ */

/* ============ REVIEW ============ */
function spark() {
  const cur = monday(new Date()), pts = [];
  for (let i = 11; i >= 0; i--) { const m = addDays(cur, -7 * i), w = anyWeek(wid(m)); pts.push({ m, f: w && w.r && w.r.felt }); }
  if (pts.filter(p => p.f).length < 2) return `<p class="hint" style="margin:0">Your trend appears here after two weekly reviews.</p>`;
  const W = 320, H = 110, L = 22, R = 10, Tp = 12, B = 22;
  const x = i => L + i * (W - L - R) / 11, y = v => Tp + (5 - v) * (H - Tp - B) / 4;
  let path = "", on = false;
  pts.forEach((p, i) => { if (p.f) { path += (on ? "L" : "M") + x(i).toFixed(1) + " " + y(p.f).toFixed(1); on = true; } else on = false; });
  const lastI = pts.map(p => !!p.f).lastIndexOf(true);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Felt-sense over the last 12 weeks">
    ${[1, 3, 5].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => p.f ? `<circle cx="${x(i)}" cy="${y(p.f)}" r="${i === lastI ? 5 : 4}" fill="${i === lastI ? "var(--brass)" : "var(--accent)"}" stroke="var(--surface)" stroke-width="2"><title>Week of ${fmtShort(p.m)}: ${p.f} of 5</title></circle>` : "").join("")}
    <text x="${x(0)}" y="${H - 6}">${fmtShort(pts[0].m)}</text><text x="${x(11)}" y="${H - 6}" text-anchor="end">${fmtShort(pts[11].m)}</text>
    <text x="${Math.min(x(lastI) + 8, W - R - 4)}" y="${y(pts[lastI].f) - 9}" text-anchor="${lastI > 9 ? "end" : "start"}" style="fill:var(--ink)">${pts[lastI].f}</text></svg>`;
}
function coachCard() {
  if (!S.sample) return "";
  const c = S.coach;
  return `<h3>Coaching note</h3><div class="card pad">
    ${c && c.text ? `<div class="coach">${esc(c.text)}</div>` : c && c.busy ? `<span class="thinking"><i></i><i></i><i></i>&nbsp;Reading your last four weeks…</span>` : `<p class="hint" style="margin:0 0 10px">Claude reads your goal, components and the last four weeks, then suggests three concrete adjustments grounded in the Compass research. Uses your Claude usage.</p>`}
    ${c && c.err ? `<p class="hint" style="margin:8px 0 0">${esc(c.err)}</p>` : ""}
    <div class="acts" style="margin-top:10px;display:flex;gap:8px">${c && c.busy ? `<button class="btn small" data-act="coachStop">Stop</button>` : `<button class="btn small primary" data-act="coach">${c && c.text ? "Ask again" : "Get a coaching note"}</button>`}</div></div>`;
}
function rReview(id, F, trips, sugg) {

  return `
  ${trips.length ? `<h2>Tripwires</h2><p class="lede">These trigger a review, not blame.</p>${trips.map(t => `<div class="trip">${esc(t)}</div>`).join("")}` : ""}
  <h2>Sunday review</h2>
  <p class="lede">About 25 minutes. Week of ${esc(fmtShort(S.viewMon))}.${r.done ? " Reviewed ✓" : ""}</p>
  <h3>1 · Floors</h3>
  <div class="card pad"><ul class="floors" style="margin:0">${vals.map(v => { const st = valueStatus(v.id, F, id); return `<li class="${st.s === "clear" ? "ok" : ""}"><span>${esc(v.name)}</span><span class="f">${st.s === "clear" ? "✓" : st.s === "rest" ? "–" : st.s === "open" && st.t === "This month" ? "…" : "✗"}</span></li>`; }).join("")}</ul></div>

  <h3>2 · Am I at peace with where this is trending?</h3>
  <div class="felt" role="group">${[1, 2, 3, 4, 5].map(n => `<button data-act="felt" data-v="${n}" aria-pressed="${r.felt === n}"><b>${n}</b><small>${["Adrift", "Uneasy", "Steady", "Good", "At peace"][n - 1]}</small></button>`).join("")}</div>
  ${r.felt && r.felt <= 2 ? `<p class="hint" style="margin:10px 0 6px">Which need was starved?</p><div class="chips">${needs.map(n => `<button class="chip ${(r.starved || []).includes(n) ? "sel" : ""}" data-act="starve" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : ""}
  <h3>3 · What made this week fun?</h3>
  <textarea id="r-fun" data-r="fun" rows="2" placeholder="Protect it next week">${esc(r.fun)}</textarea>
  <h3>4 · Next week</h3>
  <div class="card pad"><div class="row"><div><b>Pre-declare a Minimum Viable Week</b><div class="hint">Travel, a deadline or a family event coming up.</div></div><button class="switch" role="switch" aria-checked="${pre}" data-act="preMvw" aria-label="Minimum Viable Week next week"></button></div></div>
  <h3>5 · Clear your head</h3>
  <p class="hint" style="margin:0 0 8px">Empty everything that's circling, sort it, then choose up to ${ERRAND_CAP} errands for next week. Writing down when you'll handle something is what quiets it.</p>
  <div class="card">${capBox("capReview", "Anything else on your mind? One per line.")}</div>
  ${inboxCta() ? `<div style="margin-top:10px">${inboxCta()}</div>` : ""}
  ${(() => { const nx = nextWkId(), picked = weekErrands(nx), cands = laterErrands().concat(weekErrands()).filter(i => i.wk !== nx);
    if (!picked.length && !cands.length) return "";
    return `<p class="hint" style="margin:12px 0 6px">Next week's errands · ${picked.length} of ${ERRAND_CAP}</p><div class="chips">${picked.map(i => `<button class="chip sel" data-act="tNext" data-id="${i.id}">✓ ${esc(i.t)}</button>`).join("")}${cands.slice(0, 20).map(i => `<button class="chip" data-act="tNext" data-id="${i.id}">${esc(i.t)}</button>`).join("")}</div>`; })()}
  <div style="margin-top:16px"><button class="btn primary" data-act="reviewDone" id="reviewDoneBtn">${r.done ? "Reviewed ✓" : "Mark review done"}</button></div>
  ${sugg.length ? `<h3>Compass suggests</h3>${suggCard(sugg)}` : ""}

  <h3>Felt-sense, last 12 weeks</h3>

  </div>`;

/* ============ COMPASS (design) ============ */
function compRow(c) {
  const tags = [c.mvw && !c.fun ? '<span class="tag mvw">Safety net</span>' : "", c.alt ? `<span class="tag">Week ${c.alt}</span>` : "", c.people ? '<span class="tag">People</span>' : "", c.block ? `<span class="tag">${c.gcal ? "On calendar" : "Has a time"}</span>` : "", c.ai ? '<span class="tag ai">Tailored</span>' : ""].join("");
  return `<button class="comp" data-act="editComp" data-id="${esc(c.id)}"><span class="lbl"><span>${esc(c.name)}</span><small>${esc(cadenceText(c))}${c.hours && !c.fun ? " · ~" + hrs(c.hours * (c.cadence === "monthly" ? c.target / 4.3 : c.target) * (c.alt ? .5 : 1)) + " h/wk" : ""}</small>${tags ? `<span class="tags" style="margin-top:4px">${tags}</span>` : ""}</span><span class="chev">›</span></button>`;
}
function meterStatus(cap, avail) {
  if (cap > avail * 1.05) return `Over by ${fmtDur(cap - avail)}`;
  if (cap > avail * 0.85) return "Fits, but tight";
  return `Fits, ${fmtDur(avail - cap)} to spare`;
}
function allocBar(list, avail) {
  const al = allocation(list), cap = al.reduce((a, x) => a + x.h, 0), scale = Math.max(cap, avail, 0.01);
  const segs = al.filter(x => x.h > 0).map(x => `<i style="width:${(x.h / scale * 100).toFixed(2)}%;background:${valColor(x.v)}" title="${esc(valName(x.v))}: ${fmtDur(x.h)} a week"></i>`).join("");
  return `<div class="sbar" role="img" aria-label="${al.filter(x => x.h).map(x => `${valName(x.v)} ${fmtDur(x.h)}`).join(", ")}; budget ${avail} h">${segs}<b class="bmark" style="left:${Math.min(100, avail / scale * 100).toFixed(2)}%" aria-hidden="true"></b></div>`;
}
function meter(list, avail, idPrefix = "") {
  const scored = list.filter(c => !c.fun && c.on !== false);
  const cap = capacity(list), over = cap > avail * 1.05;
  const rows = scored.map(c => ({ c, w: weeklyHours(c) })).sort((a, b) => b.w - a.w);
  const zero = rows.filter(r => !r.c.hours).length;
  const wk = S.ob && S.ob.d.week ? weekCalc(S.ob.d.week) : profile() && profile().week ? weekCalc(profile().week) : null;
  return `<div class="card meter ${over ? "over" : ""}">
    <div class="row"><b>This week's floors</b><span class="mstat ${over ? "bad" : ""}" data-mstat="1">${esc(meterStatus(cap, avail))}</span></div>
    ${allocBar(list, avail)}
    <div class="nums"><span><b>${fmtDur(cap)}</b> a week <span class="hint">· ${fmtDur(cap / 7)} a day</span></span><span>Budget <b data-budget="1">${avail} h</b> <button class="linkish" data-act="loadToggle" aria-expanded="${!!S.loadOpen}" style="margin-left:6px">${S.loadOpen ? "Hide ▴" : "Details ▾"}</button></span></div>
    ${S.loadOpen ? `<div class="explain">
      <label class="flabel" for="${idPrefix}cap">Budget for floors: <span data-budget="1">${avail} h</span> a week${wk ? ` · Your week suggested ${wk.floors} h` : ""}</label>
      <input type="range" min="4" max="50" step="1" value="${avail}" id="${idPrefix}cap" data-cap="1">
      <p><b>How the total works:</b> each component's time × how often it happens in a week. Daily ones count their days, monthly ones are divided by 4.3, alternating-week ones count half, and fun-menu items are never counted.</p>
      <p><b>The budget</b> comes from Your week: the free time left after sleep, work, commute, caring and home life, and the share you chose to give to floors. The marker on the bar shows it.</p>
      <p><b>The suggested split</b> gives each value an equal share and your Cores a double share. It's a starting point, not a rule.</p>
      <div class="brk">${rows.map(r => `<div class="brow"><div class="nm"><span class="vdot" style="background:${valColor(r.c.value)}"></span>${esc(r.c.name)}<small>${esc(loadFormula(r.c))}</small></div><span class="wk">${fmtDur(r.w)}</span></div>`).join("")}
        <div class="brow tot"><div class="nm">Total</div><span class="wk">${fmtDur(cap)}</span></div></div>
      ${zero ? `<p class="hint" style="margin:0">${zero} item${zero > 1 ? "s" : ""} like “Slept 7+ hours” take no extra time, so ${zero > 1 ? "they count" : "it counts"} as 0.</p>` : ""}</div>` : ""}</div>`;
}

/* ============ calendar ============ */
const tz = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; } };
function firstOcc(c) {
  const b = c.block, now = new Date(), [h, m] = b.time.split(":").map(Number);
  for (let i = 0; i < 21; i++) {
    const d = addDays(new Date(now.getFullYear(), now.getMonth(), now.getDate()), i); d.setHours(h, m, 0, 0);
    if (d <= now || !b.days.includes((d.getDay() + 6) % 7)) continue;
    if (c.alt && weekKind(dkey(monday(d))) !== c.alt) continue;
    return d;
  }
  return addDays(now, 1);
}
const rrule = c => "RRULE:FREQ=WEEKLY;" + (c.alt ? "INTERVAL=2;" : "") + "BYDAY=" + c.block.days.slice().sort().map(d => RR[d]).join(",");
function isoOff(d) {
  const o = -d.getTimezoneOffset(), s = o >= 0 ? "+" : "-", a = Math.abs(o);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00${s}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
}
function gcalLink(c) {
  const s = firstOcc(c), e = new Date(s.getTime() + c.block.dur * 60000);
  const f = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(c.name) + "&dates=" + f(s) + "/" + f(e) +
    (tz() ? "&ctz=" + encodeURIComponent(tz()) : "") + "&recur=" + encodeURIComponent(rrule(c)) + "&details=" + encodeURIComponent("Compass · " + valueName(c.value) + ". Hold it loosely.");
}
async function calAdd(c) {
  if (!S.mcp || S.calMsg[c.id] === "adding") return;
  S.calMsg[c.id] = "adding"; render();
  const s = firstOcc(c), e = new Date(s.getTime() + c.block.dur * 60000);
  const input = { summary: c.name, startTime: isoOff(s), endTime: isoOff(e), recurrenceData: [rrule(c)], description: "Compass · " + valueName(c.value) + " floor. Hold it loosely." };
  if (tz()) input.timeZone = tz();
  try {
    await S.mcp.callTool("Google Calendar", "create_event", input);
    delete S.calMsg[c.id];
    editProfile(p => { const x = p.components.find(y => y.id === c.id); if (x) x.gcal = true; });
    toast("Added to Google Calendar");
  } catch (err) {
    const code = err && err.code;
    S.calMsg[c.id] = code === "needs_reauth" ? "Reconnect Google Calendar in claude.ai Settings → Connectors, then try again."
      : code === "server_not_connected" || code === "selection_required" ? "Connect Google Calendar in claude.ai Settings → Connectors."
      : code === "not_in_manifest" ? "Calendar access is turned off for Compass. Allow it when asked, then try again."
      : code === "blocked_by_policy" || code === "approval_required" ? "Your organization blocks adding calendar events from here."
      : code === "tool_error" ? "Google Calendar said: " + (err.message || "it couldn't create the event") + ". Reconnecting it with calendar permissions usually fixes this."
      : code === "server_unavailable" || code === "upstream_error" ? "Google Calendar didn't answer. The event may still have been created, so check your calendar before trying again."
      : "Couldn't reach Google Calendar from this view.";
  }
  render();
}

}
function recentWeeks() {

    case "delComp": S.confirm = "del:" + S.sheet.draft.id; break;
    case "delCompYes": { const id = S.sheet.draft.id; editProfile(p => { p.components = p.components.filter(x => x.id !== id); }); S.sheet = null; S.confirm = null; toast("Deleted"); break; }
    case "toggleCore": editProfile(p => { p.cores = p.cores || []; const v = b.dataset.v; if (p.cores.some(c => c.value === v)) p.cores = p.cores.filter(c => c.value !== v); else if (p.cores.length < 2) p.cores.push({ value: v, text: "" }); else toast("Two Cores at most."); }); break;
    case "calAdd": { const c = compById(b.dataset.id); if (c) calAdd(c); return; }
    case "calMark": editProfile(p => { const c = p.components.find(x => x.id === b.dataset.id); if (c) c.gcal = !c.gcal; }); break;
    case "redoOb": startOnboarding(true); window.scrollTo(0, 0); break;
    default: return;
  }
  render();
});
function updateOb() {
  // re-render the onboarding step without replaying the entrance animation; rows that move slide into place
  const before = {}; document.querySelectorAll(".obrow[data-rid]").forEach(el => { before[el.dataset.rid] = el.getBoundingClientRect().top; });
  const y = window.scrollY; renderOnboarding(); const st = $("#obStep"); if (st) st.classList.remove("stepin"); window.scrollTo(0, y);
  if (reduced()) return;
  document.querySelectorAll(".obrow[data-rid]").forEach(el => {
    const t = before[el.dataset.rid]; if (t === undefined) return;
    const dy = t - el.getBoundingClientRect().top; if (Math.abs(dy) < 2) return;
    el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 380, easing: "cubic-bezier(.2,.8,.2,1)" });
  });
}
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "pForm") { const name = $("#pName").value.trim(); if (!name) return; editPeople(p => { p.list.push({ id: uidGen(), name, tier: $("#pTier").value, last: null }); }); render(); const n = $("#pName"); if (n) n.focus(); }
  else if (f.id === "inForm") { const t = $("#inText").value.trim(); if (!t) return; editSettings(s => { s.inbox = (s.inbox || []).concat({ id: uidGen(), t }); }); render(); const n = $("#inText"); if (n) n.focus(); }
  else if (f.id === "obCustomValue") { const n = $("#obCv").value.trim(); if (!n) return; const id = "v-" + uidGen(); S.ob.d.custom.push({ id, name: n }); S.ob.d.values.push(id); updateOb(); }
  else if (f.classList.contains("obAdd")) { const inp = f.querySelector("input"), n = inp.value.trim(); if (!n) return; S.ob.d.comps.push({ id: "c-" + uidGen(), value: f.dataset.value, name: n, cadence: "weekly", target: 1, hours: 0.5, on: true, touched: true }); updateOb(); }
  else if (f.id === "obFunAdd") { const n = $("#obFunText").value.trim(); if (!n) return; S.ob.d.comps.push({ id: "fun-" + uidGen(), fun: true, name: n, cadence: "weekly", target: 0, hours: 0, on: true }); updateOb(); }
  else if (f.id === "customValueForm") { const n = $("#cvName").value.trim(); if (!n) return; const id = "v-" + uidGen(); editProfile(p => { p.customValues = (p.customValues || []).concat({ id, name: n }); p.values.push(id); }); S.sheet = { type: "pick", value: id }; render(); }
});
document.addEventListener("input", e => {
  const t = e.target, ds = t.dataset;
  if (ds.j) editWeek(w => { dayObj(w, S.selDay).j[ds.j] = t.value; });
  else if (ds.r) editWeek(w => { w.r[ds.r] = t.value; });
  else if (ds.m) editSettings(s => { s.months = s.months || {}; const m = s.months[monthKey()] = s.months[monthKey()] || {}; m[ds.m] = t.value; });
  else if (ds.p === "goal") editProfile(p => { p.goal = t.value; });
  else if (ds.p === "ifthen") editProfile(p => { p.ifthen = t.value.split("\n"); });
  else if (ds.core !== undefined) editProfile(p => { if (p.cores[+ds.core]) p.cores[+ds.core].text = t.value; });
  else if (ds.ob === "goal") { S.ob.d.goal = t.value; saveDraft(); const nb = document.querySelector('[data-act="obNext"]'); if (nb) nb.disabled = !(t.value.trim().length > 3 || S.ob.d.feel.length); }
  else if (ds.ob === "ifthen") { S.ob.d.ifthen = t.value.split("\n"); saveDraft(); }
  else if (ds.obe && S.ob) { const c = S.ob.d.comps.find(x => x.id === S.obEdit); if (c) c[ds.obe] = t.value;  saveDraft(); }
  else if (ds.obcore !== undefined) { const c = S.ob.d.cores[+ds.obcore]; if (c) c.text = t.value;  saveDraft(); }
  else if (ds.c && S.sheet && S.sheet.draft) { S.sheet.draft[ds.c] = ds.c === "hours" ? Math.max(0, Number(t.value) || 0) : t.value; }
  else if (ds.cb && S.sheet && S.sheet.draft && S.sheet.draft.block) { S.sheet.draft.block[ds.cb] = ds.cb === "dur" ? Math.max(5, Number(t.value) || 30) : t.value; S.sheet.draft.gcal = false; }
  else if (ds.cap) {
    const v = +t.value;
    if (S.ob) { S.ob.d.capacity = v; } else editProfile(p => { p.capacity = v; });
    document.querySelectorAll("[data-budget]").forEach(el => { el.textContent = v + " h"; });
  }
});
document.addEventListener("change", e => {
  const t = e.target, ds = t.dataset;
  if ((ds.tgt || ds.dur) && S.ob) {
    const c = S.ob.d.comps.find(x => x.id === (ds.tgt || ds.dur)); if (!c) return;
    if (ds.tgt) { const n = parseFloat(String(t.value).replace(",", ".")); if (isFinite(n) && n > 0) setFreq(c, n); else toast("Type a number, like 3"); }
    else { const h = parseDur(t.value); if (h === null) toast("Try something like 45 min, 1 h 30 or 1:30"); else { c.hours = Math.max(0, Math.min(12, Math.round(h * 60) / 60)); c.touched = true; } }
    updateOb(); return;
  }
  if (ds.cap) { if (S.ob) updateOb(); else render(); return; }
  if (t.id === "importFile" && t.files && t.files[0]) { importData(t.files[0]); t.value = ""; return; }
  if (ds.c === "value" && S.sheet && S.sheet.draft) S.sheet.draft.value = t.value;
  else if (ds.j || ds.cap) scheduleRender();
});
document.addEventListener("keydown", e => {
  const t = e.target, typing = t && /^(TEXTAREA|INPUT|SELECT)$/.test(t.tagName);
  if (typing && t.tagName === "TEXTAREA" && t.closest(".capbox") && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); const btn = t.closest(".capbox").querySelector('[data-act="capAdd"]'); if (btn) btn.click(); return; }
  if (typing && (t.dataset.tgt || t.dataset.dur) && e.key === "Enter") { e.preventDefault(); t.blur(); return; }
  if (typing && (t.id === "obe-name" || t.id === "obe-note") && e.key === "Enter") { e.preventDefault(); const btn = document.querySelector('[data-act="obEditDone"]'); if (btn) btn.click(); return; }
  if (typing && t.id === "sp-next" && e.key === "Enter") { e.preventDefault(); const btn = document.querySelector('[data-act="sortProjSave"]'); if (btn) btn.click(); return; }
  if (typing && t.id && t.id.startsWith("step-") && e.key === "Enter") { e.preventDefault(); const btn = document.querySelector(`[data-act="tStepSave"][data-id="${t.id.slice(5)}"]`); if (btn) btn.click(); return; }
  if (e.key === "Escape" && S.sheet) { S.sheet = null; if (S.ob) renderSheet(); else render(); return; }
  if (!typing && S.sheet && S.sheet.type === "sort" && !S.sortProj) {
    const map = { "1": "done", "2": "week", "3": "later", "4": "recurring", "5": "project", "6": "someday", "7": "drop", s: "skip", S: "skip" };
    const k = map[e.key]; if (k) { const btn = document.querySelector(`[data-act="sortPick"][data-k="${k}"]`); if (btn) { e.preventDefault(); btn.click(); } }
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { if (S.selDay !== todayKey() && dkey(S.viewMon) === dkey(monday(new Date()))) S.selDay = todayKey(); scheduleRender(); }
});

init();
</script>
