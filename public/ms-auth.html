<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting Microsoft To Do</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #F3F5F2; color: #17201E; padding: 16px; box-sizing: border-box; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #101514; color: #E7ECEA; } }
  a { color: inherit; }
</style>
</head>
<body>
<p id="msg">Connecting to Compass…</p>
<script>
/* Microsoft sends the sign-in result here. Hand it back to the Compass window that asked for it.
   Nothing is stored beyond this hand-off; the app swaps the one-time code for a short-lived, read-only token. */
(function () {
  var q = new URLSearchParams(location.search);
  var msg = { type: "ms-auth", code: q.get("code"), state: q.get("state"), error: q.get("error_description") || q.get("error") };
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage(msg, location.origin);
      window.close();
      setTimeout(function () { document.getElementById("msg").textContent = "Done. You can close this window and go back to Compass."; }, 400);
      return;
    }
  } catch (e) {}
  /* no opener (for example an app saved to the home screen): carry on in this window */
  try { localStorage.setItem("compass-ms-auth", JSON.stringify(Object.assign(msg, { at: Date.now() }))); } catch (e) {}
  location.replace("/?ms=1");
})();
</script>
</body>
</html>
